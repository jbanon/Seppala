# Bloque server de nginx para seppala.winsoft.es (subdominio de pruebas/revisión de Aluminios Seppala,
# en el mismo servidor compartido que otras webs: clientesmarchante.winsoft.es, gd.winsoft.es, etc.).
# Traducción a nginx de web/.htaccess (mantener los dos a la par con REDIRECCIONES.md).
#
# Instalación (ver despliegue/LEEME-despliegue.md para el procedimiento completo):
#   sudo cp despliegue/seppala.winsoft.es.nginx.conf /etc/nginx/sites-available/seppala.winsoft.es
#   sudo ln -s /etc/nginx/sites-available/seppala.winsoft.es /etc/nginx/sites-enabled/seppala.winsoft.es
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seppala.winsoft.es   # añade HTTPS y el redirect 80->443 automáticamente
#
# Tras el certbot, este fichero en /etc/nginx/sites-available/ quedará con bloques "managed by Certbot"
# añadidos (ver clientesmarchante.conf o gd.winsoft.es como referencia de cómo queda). No sobrescribir ese
# fichero con este si ya tiene HTTPS configurado: copiar los cambios a mano.
server {
    listen 80;
    server_name seppala.winsoft.es;
    root /var/www/seppala;
    index index.html;
    error_page 404 /404.html;
    charset utf-8;

    # Subdominio de pruebas: fuera de buscadores (la URL definitiva es www.aluminioseppala.com)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Redirecciones 301 de la web antigua (igual que web/.htaccess)
    location ~ ^/automatismo/?$ { return 301 /motorizacion/; }
    location ~ ^/componentes/?$ { return 301 /complementos/; }
    location ~ ^/aviso-legal-politica-privacidad/?$ { return 301 /privacidad/; }
    location ~ ^/politica-de-cookies/?$ { return 301 /cookies/; }
    location ~ ^/mas-informacion-sobre-las-cookies/?$ { return 301 /cookies/#navegadores; }
    location ~ ^/(noticias|hola-mundo|category|author|2019)(/.*)?$ { return 301 /; }
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php|feed|comments)(/.*)?$ { return 301 /; }

    location / { try_files $uri $uri/ =404; }
    location ~* \.(woff2|webp|png|svg|jpe?g|mp4|pdf)$ { expires 6M; add_header Cache-Control "public"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location ~* \.(css|js)$ { expires 1M; add_header Cache-Control "public"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json;

    access_log /var/log/nginx/seppala_access.log;
    error_log  /var/log/nginx/seppala_error.log;
}
